PACKAGE_NAME="intel-gna"
PACKAGE_VERSION="@PKGVER@"

# Probe the target kernel's APIs before each build. DKMS rebuilds against
# kernels that did not exist when this was written, so feature-detect rather
# than test LINUX_VERSION_CODE (distros backport APIs and version checks lie).
PRE_BUILD="conftest.sh ${kernel_source_dir} ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/gna_config.h"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]="gna"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
